name: agricentre
description: "AgriCentre - Smart Agriculture, Quality and Transportation Monitoring Platform"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Location
  geolocator: ^10.1.0

  # Networking
  dio: ^5.4.0
  http: ^1.2.0

  # Local storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.1

  # Camera and image processing
  camera: ^0.10.5+5
  image: ^4.1.3

  # Permissions
  permission_handler: ^11.0.1

  # File handling
  file_picker: ^8.0.7

  # Device information
  device_info_plus: ^10.1.0

  # Date and time formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  windows:
    generate: true
    image_path: "assets/icon/app.png"
    icon_size: 256
  image_path: "assets/icon/app.png"
  adaptive_icon_background: "#16A34A"
  adaptive_icon_foreground: "assets/icon/app.png"